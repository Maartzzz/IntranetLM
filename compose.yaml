services:
  db:
    image: postgres:17-alpine
    container_name: intranet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: intranet
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet-network

  backend:
    build:
      context: ./Backend/intranet-api
    container_name: intranet-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/intranet
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_UPLOAD_DIR: /app/uploads/materials
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads/materials
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Frontend/intranet-front
    container_name: intranet-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - intranet-network

volumes:
  postgres_data:
  uploads_data:

networks:
  intranet-network:
    driver: bridge