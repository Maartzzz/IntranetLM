<h2 mat-dialog-title class="dialog-title">
    {{ data.title }}
</h2>

<div mat-dialog-content class="dialog-content">
    <p>
        {{ data.message }}
    </p>
</div>

<div mat-dialog-actions class="dialog-actions">

    <button
        mat-button
        type="button"
        (click)="cancel()"
    >
        {{ data.cancelText }}
    </button>

    <button
        mat-flat-button
        type="button"
        (click)="confirm()"
    >
        {{ data.confirmText }}
    </button>

</div>
