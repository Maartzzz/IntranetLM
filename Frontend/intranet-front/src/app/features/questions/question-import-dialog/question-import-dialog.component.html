<h2 mat-dialog-title>
	Importar preguntas
</h2>

<mat-dialog-content>

	<div class="import-info">

		<p>
			Selecciona un archivo Excel con las preguntas
			que deseas importar al curso.
		</p>

		<p class="format-info">
			Formato permitido: <strong>.xlsx</strong>
		</p>

		<button
				type="button"
				class="template-button"
				(click)="downloadTemplate()"
				[disabled]="importing"
			>
				Descargar plantilla Excel
		</button>

	</div>

	<div class="file-section">

		<input
			#fileInput
			type="file"
			accept=".xlsx"
			hidden
			(change)="onFileSelected($event)"
		/>

		<button
			type="button"
			class="secondary-button"
			(click)="fileInput.click()"
			[disabled]="importing"
		>
			Seleccionar archivo
		</button>

		@if (file) {

			<div class="selected-file">

				<span class="file-icon">
					📄
				</span>

				<div class="file-info">

					<strong>
						{{ file.name }}
					</strong>

					<span>
						{{ file.size / 1024 | number:'1.0-0' }} KB
					</span>

				</div>

			</div>

		} @else {

			<p class="no-file">
				No se ha seleccionado ningún archivo.
			</p>

		}

	</div>

	@if (errorMessage) {

		<div class="error-message">
			{{ errorMessage }}
		</div>

	}

</mat-dialog-content>

<mat-dialog-actions align="end">

	<button
		type="button"
		class="secondary-button"
		(click)="cancel()"
		[disabled]="importing"
	>
		Cancelar
	</button>

	<button
		type="button"
		class="primary-button"
		(click)="import()"
		[disabled]="!file || importing"
	>
		{{ importing ? 'Importando...' : 'Importar preguntas' }}
	</button>

</mat-dialog-actions>
