
<aside class="sidebar">

    <div class="logo">
        <span class="logo-title">INTRANET</span>
        <span class="logo-subtitle">LMoving</span>
    </div>

    <nav class="navigation">

        <!-- Sección principal: Aprendizaje -->
        <div class="nav-section">

            <button
                type="button"
                class="nav-section-button"
                (click)="toggleAprendizaje()"
                [attr.aria-expanded]="aprendizajeExpanded"
            >
                <span>Aprendizaje</span>
                <span class="nav-arrow">
                    {{ aprendizajeExpanded ? '−' : '+' }}
                </span>
            </button>

            @if (aprendizajeExpanded) {

                <div class="nav-submenu">

                    <!-- Dashboard -->
                    @if (isAdmin() || isSupervisor()) {
                        <a
                            routerLink="/dashboard"
                            routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }"
                        >
                            <span>Dashboard</span>
                        </a>
                    }

                    <!-- Administración -->
                    @if (isAdmin()) {
                        <a
                            routerLink="/users"
                            routerLinkActive="active"
                        >
                            <span>Usuarios</span>
                        </a>
                    }

                    <!-- Administración / Supervisión -->
                    @if (isAdmin() || isSupervisor()) {
                        <a
                            routerLink="/drivers"
                            routerLinkActive="active"
                        >
                            <span>Conductores</span>
                        </a>
                    }

                    @if (isAdmin() || isSupervisor()) {
                        <a
                            routerLink="/courses"
                            routerLinkActive="active"
                        >
                            <span>Cursos</span>
                        </a>

                        <a
                            routerLink="/questions"
                            routerLinkActive="active"
                        >
                            <span>Banco de Preguntas</span>
                        </a>

                        <a
                            routerLink="/certificates"
                            routerLinkActive="active"
                        >
                            <span>Certificados</span>
                        </a>
                    }

                </div>
            }

            <!-- Disponible para todos los usuarios autenticados -->
                <a
                        routerLink="/communication"
                        routerLinkActive="active"
                >
                        <span>Sugerencias y Quejas</span>
                </a>

        </div>

    </nav>

    <div class="sidebar-footer">

        <button
            type="button"
            class="logout-button"
            (click)="logout()"
        >
            Cerrar sesión
        </button>

    </div>

</aside>
